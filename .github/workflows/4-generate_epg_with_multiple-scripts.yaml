name: 4 update xml to current repository and scripts to epg_scripts branch of tvepg private repository

###############################################################################
# EPG数据自动生成工作流
# 
# 功能概述:
#   - 从私有仓库获取EPG生成脚本（PHP/Python）
#   - 在临时目录中执行脚本，避免污染工作目录
#   - 将生成的EPG数据推送到当前仓库的epg目录
#   - 将生成的Python备份文件推送到私有仓库tvepg的epg_scripts分支
#
# 主要特性:
#   - 支持多语言多脚本（PHP 8.2 + Python 3.x）
#   - 安全的私有仓库访问（使用PAT_TOKEN）
#   - 自动错误处理和报告机制
#   - 脚本执行后自动清理临时目录，不保留任何残留
#   - 北京时间戳的提交信息
#   - 可配置的脚本执行列表和依赖文件列表
#   - 支持所有生成文件类型（.py, .xml, .xml.gz等）
#   - 支持双向同步：从私有仓库拉取脚本，并将生成文件推送回私有仓库
#
# 触发条件:
#   - 定时触发: 近似每隔5天的UTC时间 19:40（北京时间3:40）自动运行
#   - 手动触发: 可在GitHub Actions页面手动执行
#
# 前置要求:
#   - 在仓库Secrets中设置PAT_TOKEN，具有访问私有仓库的权限
#   - 私有仓库tvepg的epg_scripts分支包含所需的EPG脚本
#
# 输出结果:
#   - 生成的XML文件将保存在当前仓库的epg目录中
#   - 生成的Python备份文件将推送回tvepg/epg_scripts分支
#   - 详细的执行日志和错误报告
###############################################################################

on:
  workflow_dispatch:  # 手动触发 - 可在GitHub Actions页面手动运行此工作流
  # schedule:
    # 定时触发 - 近似每隔5天的UTC时间19点40分（北京时间凌晨3点40分）自动运行
    # - cron: '40 19 1,6,11,16,21,26 * *'

jobs:
  generate-epg:
    runs-on: ubuntu-latest  # 使用最新版Ubuntu系统作为运行环境
    
    steps:
    # 步骤1: 检出当前仓库（作为最终推送目标的工作目录）
    - name: Checkout current repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.PAT_TOKEN }}  # 使用个人访问令牌进行认证
        fetch-depth: 1  # 获取最新git历史记录

    # 步骤2: 设置Python环境
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'  # 指定Python 3.x版本

    # 步骤3: 设置PHP环境
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'  # 指定PHP 8.2版本
        extensions: curl, xml, mbstring  # 一键安装所需扩展
        
    # 步骤4: 安装Python依赖包
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip  # 升级pip到最新版本
        # 安装Python脚本可能需要的库
        pip install requests beautifulsoup4 lxml pytz httpx aiohttp loguru curl_cffi

    # 步骤5: 安装PHP扩展（已注释，如需可取消）
    # - name: Install PHP dependencies
      # run: |
        # sudo apt-get update
        # sudo apt-get install -y php-curl php-xml php-mbstring        

    # 步骤6: 检出tvepg仓库的epg_scripts分支（用于获取脚本和依赖）
    - name: Checkout private repository (epg_scripts branch)
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/tvepg  # 私有仓库
        token: ${{ secrets.PAT_TOKEN }}  # 使用个人访问令牌
        ref: epg_scripts  # 指定分支
        path: private_repo_temp  # 检出到指定目录

    # 步骤7: 从tvepg/epg_scripts分支复制依赖文件（仅复制存在的文件，不存在则报错，不创建默认文件）
    - name: Copy dependency files from private repository
      id: copy-dependencies
      run: |
        echo "📁 从 tvepg/epg_scripts 分支复制依赖文件到临时目录..."
        
        # 定义需要复制的依赖文件数组
        # 可以根据需要轻松添加、移除或注释依赖文件
        dependency_scripts=(
          # Python依赖脚本
          "bbcable_backup_channels_dict.py"
          # 可以添加更多依赖文件
          "tvmao_channels_list.py"
          # "config.json"
        )
        
        # 存储成功复制的依赖文件
        copied_dependencies=""
        
        # 存储失败的依赖文件
        failed_dependencies=""
        
        # 循环复制每个依赖文件
        for dependency in "${dependency_scripts[@]}"; do
          echo "📋 处理依赖文件: $dependency"
          
          # 检查依赖文件在私有仓库中是否存在
          if [ -f "private_repo_temp/$dependency" ]; then
            # 先复制到临时目录（稍后统一处理），这里先存到变量，后续在步骤8中复制
            # 由于我们使用临时目录，这里只记录，不实际复制到根目录
            # 将依赖文件路径保存到环境变量，供步骤8使用
            echo "✅ 找到依赖文件: $dependency"
            copied_dependencies="$copied_dependencies $dependency"
          else
            echo "❌ 错误: tvepg/epg_scripts 分支中未找到依赖文件 $dependency"
            failed_dependencies="$failed_dependencies $dependency"
            # 注意：不创建任何默认文件，保持原始逻辑
          fi
        done
        
        echo "===================================="
        echo "📊 依赖文件检查结果:"
        if [ -n "$copied_dependencies" ]; then
          echo "✅ 找到的依赖文件:$copied_dependencies"
          # 将依赖文件列表保存到环境变量，供后续步骤使用
          COPIED_DEPENDENCIES=$(echo "$copied_dependencies" | sed 's/^ *//;s/ *$//')
          echo "COPIED_DEPENDENCIES=$COPIED_DEPENDENCIES" >> $GITHUB_ENV
          echo "copied_dependencies=$COPIED_DEPENDENCIES" >> $GITHUB_OUTPUT
        else
          echo "ℹ️ 没有找到任何依赖文件"
        fi
        
        if [ -n "$failed_dependencies" ]; then
          echo "❌ 未找到的依赖文件:$failed_dependencies"
          # 保存失败列表到环境变量
          FAILED_DEPENDENCIES=$(echo "$failed_dependencies" | sed 's/^ *//;s/ *$//')
          echo "FAILED_DEPENDENCIES=$FAILED_DEPENDENCIES" >> $GITHUB_ENV
          echo "failed_dependencies=$FAILED_DEPENDENCIES" >> $GITHUB_OUTPUT
          echo "⚠️ 警告: 部分依赖文件缺失，可能会影响后续脚本执行"
        else
          echo "✅ 所有依赖文件都已找到"
        fi
        
        echo "===================================="

    # 步骤8: 在临时目录中执行所有主脚本，并收集生成的文件
    - name: Define and execute main scripts in temporary directory
      id: execute-scripts
      run: |
        # 定义要执行的主脚本数组（PHP和Python）
        # 可以轻松添加、移除或注释不需要的脚本
        scripts=(
          # "get_bbcable_backup_channels_dict.py"  # 获取BB宽频多个频道的字典
          # "epganywhereusa.php"
          # "epg-fixer.php"          # PHP EPG修复器脚本（从EPG_CONFIG读取配置）
          # "epgguangxi.php"         # PHP 广西EPG脚本
          # "get_mytvsuper_epg.py"      # Python mytvsuper EPG脚本
          "get_mod_epg.py"
          "get_bbcable_epg.py"
          "get_kbro_epg.py"
          "get_hami_epg.py"
          "get_ctitv_epg.py"
          "get_celestial_epg.py"
          # "get_tvmao_epg.py"
        )
        
        # 定义需要保存到当前仓库 epg 目录的数据文件后缀
        SAVE_EXTENSIONS=(".xml" ".xml.gz" ".json" ".txt" ".dat")
        
        # 存储失败脚本的数组
        failed_scripts=()
        
        # 记录将要推送到远程 tvepg/epg_scripts 分支的脚本文件及被修改的依赖文件
        generated_files_for_private_repo=""
        
        # 创建临时目录（使用时间戳确保唯一性）
        WORKDIR="workdir_$(date +%s)"
        mkdir -p "$WORKDIR"
        echo "📁 创建临时工作目录: $WORKDIR"
        
        # ---- 复制依赖文件到临时目录 ----
        if [ -n "${{ steps.copy-dependencies.outputs.copied_dependencies }}" ]; then
          COPIED_DEPS="${{ steps.copy-dependencies.outputs.copied_dependencies }}"
          echo "📋 复制依赖文件到临时目录..."
          IFS=' ' read -r -a dependency_array <<< "$COPIED_DEPS"
          for dependency in "${dependency_array[@]}"; do
            dependency=$(echo "$dependency" | xargs)
            if [ -n "$dependency" ] && [ -f "private_repo_temp/$dependency" ]; then
              cp "private_repo_temp/$dependency" "$WORKDIR/"
              echo "  ✅ 已复制依赖文件: $dependency"
            fi
          done
        else
          echo "ℹ️ 没有依赖文件需要复制"
        fi
        
        # ---- 复制主脚本到临时目录 ----
        echo "📋 复制主脚本到临时目录..."
        for script in "${scripts[@]}"; do
          if [ -f "private_repo_temp/$script" ]; then
            cp "private_repo_temp/$script" "$WORKDIR/"
            echo "  ✅ 已复制主脚本: $script"
          else
            echo "⚠️ 警告: 主脚本 $script 在 tvepg/epg_scripts 分支不存在，跳过"
            failed_scripts+=("$script (不存在)")
          fi
        done
        
        # ---- 进入临时目录执行所有主脚本 ----
        cd "$WORKDIR"
        echo "📍 当前工作目录: $(pwd)"
        
        # 重试函数（每个脚本最多3次）
        retry() {
          local max_attempts=3
          local attempt=1
          while [ $attempt -le $max_attempts ]; do
            if eval "$@"; then
              return 0
            fi
            echo "⚠️ 第 $attempt 次尝试失败，2 秒后重试..."
            sleep 2
            attempt=$((attempt + 1))
          done
          return 1
        }
        
        # 循环执行每个主脚本
        for script in "${scripts[@]}"; do
          # 检查脚本是否存在于临时目录（可能之前复制失败）
          if [ ! -f "$script" ]; then
            echo "⚠️ 警告: 脚本 $script 不在临时目录，跳过"
            continue
          fi
          
          echo "::group::🛠 执行 $script"
          echo "=== 开始执行: $script ==="
          
          # 初始化退出码
          exit_code=0
          
          # 记录开始时间
          start_time=$(date +%s)
          
          # 根据扩展名执行
          if [[ "$script" == *.php ]]; then
            php "$script" || exit_code=$?
          elif [[ "$script" == *.py ]]; then
            python "$script" || exit_code=$?
          else
            echo "❌ 不支持的脚本类型: $script"
            exit_code=1
          fi
          
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          
          if [ $exit_code -ne 0 ]; then
            echo "❌ 脚本 $script 执行失败 (耗时 ${duration} 秒)"
            failed_scripts+=("$script")
          else
            echo "✅ 脚本 $script 执行成功 (耗时 ${duration} 秒)"
          fi
          echo "::endgroup::"
        done
        
        # ---- 收集生成的数据文件（匹配后缀）并复制到 ../epg/ ----
        echo "📂 收集生成的数据文件..."
        mkdir -p ../epg
        for ext in "${SAVE_EXTENSIONS[@]}"; do
          # 查找当前目录下所有匹配后缀的文件（仅根目录）
          for file in *"$ext"; do
            if [ -f "$file" ]; then
              cp "$file" "../epg/"
              echo "  ✅ 已复制数据文件: $file -> ../epg/"
            fi
          done
        done
        
        # ---- 收集生成的脚本文件并复制到 ../private_repo_temp/ ----
        # 注意：这里要排除原始的脚本，但因为是临时目录，所有文件都是新复制的，
        # 我们通过比较文件是否在原始主脚本列表中来判断是否为生成的。
        echo "📂 收集生成的脚本文件..."
        for file in *.py *.php; do
          if [ -f "$file" ]; then
            # 检查该文件是否在原始主脚本列表中
            is_original=false
            for orig_script in "${scripts[@]}"; do
              if [ "$file" == "$orig_script" ]; then
                is_original=true
                break
              fi
            done
            if [ "$is_original" = false ]; then
              # 这是新生成的脚本文件，复制到 private_repo_temp 以便推送到远程
              cp "$file" "../private_repo_temp/"
              echo "  ✅ 已复制生成的脚本: $file -> ../private_repo_temp/"
              generated_files_for_private_repo="$generated_files_for_private_repo $file"
            fi
          fi
        done
        
        # ---- 检测依赖文件是否被修改（内容比较） ----
        # 只检测步骤7中定义的那些依赖文件
        if [ -n "${{ steps.copy-dependencies.outputs.copied_dependencies }}" ]; then
          COPIED_DEPS="${{ steps.copy-dependencies.outputs.copied_dependencies }}"
          IFS=' ' read -r -a dependency_array <<< "$COPIED_DEPS"
          for dependency in "${dependency_array[@]}"; do
            dependency=$(echo "$dependency" | xargs)
            if [ -n "$dependency" ] && [ -f "$dependency" ]; then
              # 检查该依赖文件是否在 private_repo_temp 中也有（原始版本）
              if [ -f "../private_repo_temp/$dependency" ]; then
                if ! cmp -s "$dependency" "../private_repo_temp/$dependency"; then
                  echo "📁 依赖文件被修改: $dependency"
                  cp "$dependency" "../private_repo_temp/"
                  generated_files_for_private_repo="$generated_files_for_private_repo $dependency"
                else
                  echo "ℹ️ 依赖文件未修改: $dependency"
                fi
              else
                # 如果原始版本不存在，说明是新建的（可能之前不存在），也复制过去
                echo "📁 新依赖文件: $dependency（原始版本不存在）"
                cp "$dependency" "../private_repo_temp/"
                generated_files_for_private_repo="$generated_files_for_private_repo $dependency"
              fi
            fi
          done
        fi
        
        # ---- 返回上级目录 ----
        cd ..
        
        # ---- 清理临时目录 ----
        rm -rf "$WORKDIR"
        echo "🧹 临时目录已清理: $WORKDIR"
        
        # ---- 设置环境变量供后续步骤使用 ----
        # 检查本地 epg 目录是否有内容
        if [ "$(ls -A epg 2>/dev/null)" ]; then
          echo "HAS_CURRENT_REPO_FILES=true" >> $GITHUB_ENV
        else
          echo "HAS_CURRENT_REPO_FILES=false" >> $GITHUB_ENV
        fi
        
        # 设置私有仓库文件列表
        if [ -n "$generated_files_for_private_repo" ]; then
          generated_files_for_private_repo=$(echo "$generated_files_for_private_repo" | sed 's/^ *//;s/ *$//')
          echo "PRIVATE_REPO_FILES='$generated_files_for_private_repo'" >> $GITHUB_ENV
          echo "HAS_PRIVATE_REPO_FILES=true" >> $GITHUB_ENV
        else
          echo "PRIVATE_REPO_FILES=''" >> $GITHUB_ENV
          echo "HAS_PRIVATE_REPO_FILES=false" >> $GITHUB_ENV
        fi
        
        # ---- 报告执行结果 ----
        echo "=== 脚本执行结果 ==="
        if [ ${#failed_scripts[@]} -eq 0 ]; then
          echo "✅ 所有主脚本执行成功!"
          if [ -n "${{ steps.copy-dependencies.outputs.failed_dependencies }}" ]; then
            echo "⚠️ 警告: 以下依赖文件未找到: ${{ steps.copy-dependencies.outputs.failed_dependencies }}"
          fi
        else
          echo "ℹ️ 以下主脚本执行失败:"
          for failed in "${failed_scripts[@]}"; do
            echo "  - $failed"
          done
          if [ -n "${{ steps.copy-dependencies.outputs.failed_dependencies }}" ]; then
            echo "⚠️ 警告: 以下依赖文件未找到: ${{ steps.copy-dependencies.outputs.failed_dependencies }}"
          fi
          # 即使有失败，也继续执行（已生成的文件仍会提交）
        fi
        
        if [ "$HAS_CURRENT_REPO_FILES" = "true" ]; then
          echo "📁 数据文件已保存到本地当前仓库的 epg 目录，准备提交"
        else
          echo "ℹ️ 本地当前仓库的 epg 目录为空，没有数据文件需要提交"
        fi
        
        if [ "$HAS_PRIVATE_REPO_FILES" = "true" ]; then
          echo "📁 需要推送到远程 tvepg/epg_scripts 分支的脚本文件及被修改的依赖文件: $generated_files_for_private_repo"
        else
          echo "ℹ️ 没有需要推送到远程 tvepg/epg_scripts 分支的脚本文件或修改的依赖文件"
        fi

    # 步骤9: 复制需要推送到远程 tvepg/epg_scripts 分支的脚本文件及被修改的依赖文件到本地副本
    - name: Copy files to private repository directory
      if: env.HAS_PRIVATE_REPO_FILES == 'true'
      env:
        PRIVATE_REPO_FILES: ${{ env.PRIVATE_REPO_FILES }}
      run: |
        echo "📋 复制需要推送到远程 tvepg/epg_scripts 分支的脚本文件及被修改的依赖文件到本地副本..."
        echo "需要复制的文件: $PRIVATE_REPO_FILES"
        
        IFS=' ' read -r -a files_array <<< "$PRIVATE_REPO_FILES"
        
        for file in "${files_array[@]}"; do
          if [ -f "$file" ]; then
            cp "$file" "private_repo_temp/$file"
            echo "✅ 已复制: $file -> private_repo_temp/$file"
          else
            echo "⚠️ 警告: 文件不存在，无法复制: $file"
          fi
        done

    # 步骤10: 推送生成的脚本文件及被修改的依赖文件到远程 tvepg/epg_scripts 分支
    - name: Push generated scripts and modified dependencies to remote tvepg/epg_scripts branch
      if: env.HAS_PRIVATE_REPO_FILES == 'true'
      run: |
        echo "🚀 准备推送生成的脚本文件及被修改的依赖文件到远程 tvepg/epg_scripts 分支..."
        
        # 进入私有仓库目录
        cd private_repo_temp
        
        # 配置Git用户信息
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        
        # 设置远程URL为包含PAT_TOKEN的格式
        git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository_owner }}/tvepg.git
        
        # 拉取远程 tvepg/epg_scripts 分支最新更改，避免冲突（自动暂存本地变更）
        git pull origin epg_scripts --rebase --autostash
        
        # 获取北京时间
        BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
        
        # 添加所有更改
        git add .
        
        # 检查是否有实际更改需要提交
        if git diff --staged --quiet; then
          echo "ℹ️ 远程 tvepg/epg_scripts 分支没有需要提交的更改"
        else
          # 获取本次实际要提交的文件列表
          FILE_LIST=$(git diff --staged --name-only | tr '\n' ', ' | sed 's/,$//')
          
          # 构建提交信息
          if [ -n "$FILE_LIST" ]; then
            COMMIT_MSG="🤖 自动更新生成的脚本文件及被修改的依赖文件 [北京时间: $BEIJING_TIME] | 变更: $FILE_LIST"
          else
            COMMIT_MSG="🤖 自动更新生成的脚本文件及被修改的依赖文件 [北京时间: $BEIJING_TIME]"
          fi
          
          # 提交更改
          git commit -m "$COMMIT_MSG"
          
          # 推送更改到远程 tvepg/epg_scripts 分支（含重试）
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "ℹ️ 尝试推送更改到远程 tvepg/epg_scripts 分支 (尝试 $((RETRY_COUNT+1))/$MAX_RETRIES)..."
            if git push origin epg_scripts; then
              echo "✅ 成功推送生成的脚本文件及被修改的依赖文件到远程 tvepg/epg_scripts 分支"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT+1))
              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "❌ 推送失败，已达到最大重试次数"
                exit 1
              fi
              echo "🔄 推送失败，重新拉取远程 tvepg/epg_scripts 分支最新更改并重试..."
              git pull origin epg_scripts --rebase --autostash
            fi
          done
          
          # 输出推送的文件列表
          echo "📋 推送的文件列表:"
          git show --name-only --pretty="" HEAD
        fi
        
        # 返回工作目录
        cd ..

    # 步骤11: 清理私有仓库临时目录
    - name: Clean up temporary directories
      run: |
        # 清理私有仓库临时目录
        rm -rf private_repo_temp
        echo "✅ 临时目录已清理"

    # 步骤12: 配置Git用户信息（用于当前仓库提交）
    - name: Configure Git for current repository
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    # 步骤13: 设置当前仓库的远程URL并拉取最新更改（避免提交冲突）
    - name: Set remote URL and pull latest changes for current repository
      run: |
        echo "🔄 设置远程URL并拉取当前仓库最新更改..."
        git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
        git pull origin ${{ github.ref_name }} --rebase --autostash || {
          echo "⚠️ 拉取失败，可能没有新的更改，继续执行..."
        }
        echo "✅ 已同步到当前仓库最新状态"

    # 步骤14: 获取北京时间并提交更改到当前仓库（仅提交本地有变更的文件）
    - name: Get Beijing time and commit changes to current repository
      run: |
        BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')
        
        # 检查本地工作目录中的 epg 目录是否存在且不为空
        if [ -d "epg" ] && [ "$(ls -A epg 2>/dev/null)" ]; then
          git add epg/
          
          if git diff --staged --quiet; then
            echo "ℹ️ 本地当前仓库的 epg 目录没有新变更需要提交"
          else
            FILE_LIST=$(git diff --staged --name-only | sed 's#^epg/##' | tr '\n' ', ' | sed 's/,$//')
            
            if [ -n "$FILE_LIST" ]; then
              COMMIT_MSG="🔄 Download EPG数据 [北京时间: $BEIJING_TIME] | 变更: $FILE_LIST"
            else
              COMMIT_MSG="🔄 Download EPG数据 [北京时间: $BEIJING_TIME]"
            fi
            
            git commit -m "$COMMIT_MSG"
            
            # 推送（含重试）
            MAX_RETRIES=3
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "ℹ️ 尝试推送更改到当前仓库 (尝试 $((RETRY_COUNT+1))/$MAX_RETRIES)..."
              if git push origin ${{ github.ref_name }}; then
                echo "✅ 当前仓库推送成功"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT+1))
                if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                  echo "❌ 推送失败，已达到最大重试次数"
                  exit 1
                fi
                echo "🔄 推送失败，重新拉取当前仓库最新更改并重试..."
                git pull origin ${{ github.ref_name }} --rebase --autostash
              fi
            done
            
            echo "📋 提交的文件列表:"
            git show --name-only --pretty="" HEAD
          fi
        else
          echo "ℹ️ 本地当前仓库的 epg 目录为空或不存在，没有文件需要提交"
        fi