# ================================================================
# 工作流名称：5.1「重温经典频道」每周节目单抓取
# 功能说明：
#   1. 支持多个 Python/PHP 脚本顺序执行。
#   2. 每个脚本独立重试最多 3 次，失败不影响后续脚本。
#   3. 统计每个脚本总耗时（含重试）。
#   4. 脚本失败不会阻止最终推送，已生成的文件仍会提交。
#   5. 自动识别 epg/ 目录下所有变更（新增/修改/删除），无视后缀。
#   6. 提交信息包含北京时间（UTC+8）、变更文件列表、失败脚本（仅文件名）。
#   7. 生成的文件将推送到 tvepg 仓库的 main 分支的 epg 目录（仅本次生成的文件，不推其他）。
# ================================================================
name: 5.1「重温经典频道」每周节目单抓取

on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
    paths:
      - 'epg/cwjd_image/**'
  # workflow_run:
    # workflows: ["5 Fetch WeChat CWJD Article Image (via RSS)"]
    # types:
      # - completed
    # branches:
      # - main

jobs:
  # --------------------------------------------------------------
  # Job 1: 检查是否有新图片（从当前仓库读取）
  # --------------------------------------------------------------
  check-image:
    runs-on: ubuntu-latest
    outputs:
      has_image: ${{ steps.check.outputs.has_image }}
    steps:
      - name: 检出当前仓库（用于读取图片）
        uses: actions/checkout@v6
      - id: check
        run: |
          IMG_COUNT=$(find epg/cwjd_image -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" -o -iname "*.bmp" \) | wc -l)
          echo "has_image=$([ $IMG_COUNT -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

  # --------------------------------------------------------------
  # Job 2: 主任务 — 解析图片并生成节目单
  # --------------------------------------------------------------
  fetch-program:
    needs: check-image
    if: needs.check-image.outputs.has_image == 'true'
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. 检出当前仓库（作为工作目录，包含图片）
      # ----------------------------------------------------------
      - name: 检出当前仓库
        uses: actions/checkout@v6

      # 2. 检出 tvepg 仓库的 main 分支（用于存放并推送节目单）
      - name: 检出 tvepg 仓库 main 分支
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/tvepg
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
          path: tvepg_repo

      # 3. 检出私有脚本仓库（含所有脚本）
      - name: 检出私有脚本仓库
        uses: actions/checkout@v6
        with:
          repository: yufeilai666/tvepg
          ref: epg_scripts
          token: ${{ secrets.PAT_TOKEN }}
          path: epg_scripts

      # ----------------------------------------------------------
      # 4. 环境准备
      # ----------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: xml, mbstring, curl

      - name: 安装 Tesseract 和其他 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
          pip install requests pillow pytesseract easyocr numpy

      # ----------------------------------------------------------
      # 5. 执行所有脚本（带独立重试、计时、错误收集）
      # ----------------------------------------------------------
      - name: 执行所有脚本
        timeout-minutes: 10
        env:
          BAIDU_OCR_API_KEY: ${{ secrets.BAIDU_OCR_API_KEY }}
          BAIDU_OCR_SECRET_KEY: ${{ secrets.BAIDU_OCR_SECRET_KEY }}
        run: |
          set +e

          scripts=(
            "epg_scripts/fetch_preview_cwjd_BaiduOCR.py"
            "epg_scripts/fetch_preview_cwjd_EasyOCR.py"
            "epg_scripts/fetch_preview_cwjd_TesseractOCR.py"
          )

          failed_full_paths=()
          failed_names=()

          retry() {
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if eval "$@"; then
                return 0
              fi
              echo "⚠️ 第 $attempt 次尝试失败，2 秒后重试..."
              sleep 2
              attempt=$((attempt + 1))
            done
            return 1
          }

          # 记录执行前的文件列表（仅限 epg/ 根目录，不含 cwjd_image 子目录）
          echo "📝 记录执行前的文件列表..."
          find epg/ -maxdepth 1 -type f ! -path "epg/cwjd_image/*" | sed 's|^\./||' | sort > .files_before.txt

          for script in "${scripts[@]}"; do
            script_name=$(basename "$script")
            echo "::group::执行 $script_name"
            echo "=== 开始执行: $script_name ==="

            if [ ! -f "$script" ]; then
              echo "❌ 脚本文件不存在: $script"
              failed_full_paths+=("$script")
              failed_names+=("$(basename "$script")")
              echo "::endgroup::"
              continue
            fi

            ext="${script##*.}"
            if [ "$ext" = "py" ]; then
              cmd="python $script"
            elif [ "$ext" = "php" ]; then
              cmd="php -f $script"
            else
              echo "❌ 不支持的脚本类型: $ext"
              failed_full_paths+=("$script")
              failed_names+=("$(basename "$script")")
              echo "::endgroup::"
              continue
            fi

            script_start=$(date +%s)
            if retry "$cmd"; then
              script_end=$(date +%s)
              duration=$((script_end - script_start))
              echo "✅ 脚本执行成功 (耗时 $duration 秒)"
            else
              script_end=$(date +%s)
              duration=$((script_end - script_start))
              echo "❌ 脚本重试 3 次后仍然失败 (耗时 $duration 秒)"
              failed_full_paths+=("$script")
              failed_names+=("$(basename "$script")")
            fi

            echo "::endgroup::"
          done

          # 记录执行后的文件列表
          echo "📝 记录执行后的文件列表..."
          find epg/ -maxdepth 1 -type f ! -path "epg/cwjd_image/*" | sed 's|^\./||' | sort > .files_after.txt

          # 检测新增或修改的文件（不含图片目录）
          echo "🔍 检测本次新增或修改的文件..."
          GENERATED_FILES=""
          while IFS= read -r file; do
            if [ -n "$file" ] && ! grep -qxF "$file" .files_before.txt; then
              echo "📁 检测到新生成/修改的文件: $file"
              GENERATED_FILES="$GENERATED_FILES $file"
            fi
          done < .files_after.txt

          # 将生成的文件列表保存到环境变量（供后续复制使用）
          if [ -n "$GENERATED_FILES" ]; then
            GENERATED_FILES=$(echo "$GENERATED_FILES" | sed 's/^ *//;s/ *$//')
            echo "GENERATED_FILES=$GENERATED_FILES" >> $GITHUB_ENV
            echo "HAS_GENERATED_FILES=true" >> $GITHUB_ENV
          else
            echo "HAS_GENERATED_FILES=false" >> $GITHUB_ENV
          fi

          # 清理临时文件
          rm -f .files_before.txt .files_after.txt

          if [ ${#failed_full_paths[@]} -gt 0 ]; then
            echo "❌ 以下脚本执行失败（但其他脚本生成的文件仍会被推送）："
            for f in "${failed_full_paths[@]}"; do
              echo "  - $f"
            done
            failed_names_str=$(IFS=','; echo "${failed_names[*]}")
            echo "FAILED_SCRIPTS=$failed_names_str" >> $GITHUB_ENV
          else
            echo "✅ 所有脚本执行成功"
          fi

      # ----------------------------------------------------------
      # 6. 仅复制本次生成的文件到 tvepg 仓库（不复制已有文件）
      # ----------------------------------------------------------
      - name: 复制生成的文件到 tvepg 仓库
        if: env.HAS_GENERATED_FILES == 'true'
        env:
          GENERATED_FILES: ${{ env.GENERATED_FILES }}
        run: |
          echo "📋 复制生成的文件到 tvepg 仓库..."
          echo "需要复制的文件: $GENERATED_FILES"
          
          # 确保 tvepg_repo/epg 目录存在
          mkdir -p tvepg_repo/epg
          
          IFS=' ' read -r -a files_array <<< "$GENERATED_FILES"
          for file in "${files_array[@]}"; do
            if [ -f "$file" ]; then
              cp "$file" "tvepg_repo/epg/"
              echo "✅ 已复制: $file -> tvepg_repo/epg/"
            else
              echo "⚠️ 警告: 文件不存在，无法复制: $file"
            fi
          done

      # ----------------------------------------------------------
      # 7. 提交并推送变更到 tvepg/main（带 3 次重试）
      # ----------------------------------------------------------
      - name: 提交并推送节目单到 tvepg 仓库
        if: always()
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: |
            cd tvepg_repo
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            # 拉取最新远程变更，避免冲突
            git pull origin main --rebase --autostash

            # 添加 epg/ 目录所有变更
            git add -A epg/

            if ! git diff --cached --quiet; then
              files=$(git diff --cached --name-only | xargs -n1 basename | paste -sd ',' -)
              bj_time=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M")
              commit_msg="🤖 Bot: 更新节目单 [skip ci] [${bj_time} UTC+8] | 变更文件：$files"
              if [ -n "$FAILED_SCRIPTS" ]; then
                commit_msg="$commit_msg | 失败脚本：$FAILED_SCRIPTS"
              fi
              git commit -m "$commit_msg"
              git push origin main
            else
              echo "ℹ️ 没有新变更，跳过推送。"
            fi