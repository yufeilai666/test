# ================================================================
# 工作流名称：5.1「重温经典频道」每周节目单抓取
# 功能说明：
#   1. 使用全新的临时工作目录执行脚本，避免任何已有文件干扰。
#   2. 自动将图片目录复制到临时目录，供脚本读取。
#   3. 支持多个 Python/PHP 脚本顺序执行，每个脚本独立重试最多 3 次。
#   4. 统计每个脚本总耗时（含重试）。
#   5. 脚本失败不会阻止最终推送，已生成的文件仍会提交。
#   6. 生成的所有文件（任意格式）都将复制到 tvepg 仓库的 epg 目录并推送。
#   7. 提交信息包含北京时间、变更文件列表、失败脚本。
# ================================================================
name: 5.1「重温经典频道」每周节目单抓取

on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
    paths:
      - 'epg/cwjd_image/**'
  # workflow_run:
    # workflows: ["5 Fetch WeChat CWJD Article Image (via RSS)"]
    # types:
      # - completed
    # branches:
      # - main

jobs:
  check-image:
    runs-on: ubuntu-latest
    outputs:
      has_image: ${{ steps.check.outputs.has_image }}
    steps:
      - name: 检出当前仓库（用于读取图片）
        uses: actions/checkout@v6
      - id: check
        run: |
          IMG_COUNT=$(find epg/cwjd_image -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" -o -iname "*.bmp" \) | wc -l)
          echo "has_image=$([ $IMG_COUNT -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

  fetch-program:
    needs: check-image
    if: needs.check-image.outputs.has_image == 'true'
    runs-on: ubuntu-latest

    steps:
      # 检出当前仓库（包含图片）
      - name: 检出当前仓库
        uses: actions/checkout@v6

      # 检出 tvepg 仓库的 main 分支（用于存放并推送节目单）
      - name: 检出 tvepg 仓库 main 分支
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/tvepg
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
          path: tvepg_repo

      # 检出私有脚本仓库（含所有脚本）
      - name: 检出私有脚本仓库
        uses: actions/checkout@v6
        with:
          repository: yufeilai666/tvepg
          ref: epg_scripts
          token: ${{ secrets.PAT_TOKEN }}
          path: epg_scripts   # 脚本将被克隆到当前工作区的 epg_scripts/ 目录下

      # 环境准备
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: xml, mbstring, curl

      - name: 安装 Tesseract 和其他 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
          # 补上 rich（BaiduOCR 脚本依赖它）
          pip install requests pillow pytesseract easyocr numpy rich

      # 核心：在临时目录中执行所有脚本
      - name: 在临时目录中执行所有脚本
        timeout-minutes: 10
        env:
          # 定义本步骤所需的环境变量：
          #   - 百度 OCR 密钥（供 Python/PHP 脚本使用）
          #   - SCRIPT_DIR：本地脚本目录，必须与上方私有脚本仓库 checkout 的 path 保持一致
          BAIDU_OCR_API_KEY: ${{ secrets.BAIDU_OCR_API_KEY }}
          BAIDU_OCR_SECRET_KEY: ${{ secrets.BAIDU_OCR_SECRET_KEY }}
          SCRIPT_DIR: epg_scripts
        run: |
          set +e

          # 1. 创建临时工作目录
          WORKDIR="workdir_$(date +%s)"
          mkdir -p "$WORKDIR"

          # 2. 复制图片目录到临时目录（保持相对路径 epg/cwjd_image）
          #    必须先 mkdir 目标父目录，否则 cp -r 源 目标/ 会因目标不存在而失败
          mkdir -p "$WORKDIR/epg"
          cp -r epg/cwjd_image "$WORKDIR/epg/"

          # 显式校验图片目录是否复制成功，避免静默失败后一路跑空
          if [ ! -d "$WORKDIR/epg/cwjd_image" ]; then
            echo "❌ 图片目录复制失败: $WORKDIR/epg/cwjd_image 不存在，终止执行。"
            exit 1
          fi
          echo "✅ 图片目录已复制到 $WORKDIR/epg/cwjd_image"

          # 3. 将需要用到的脚本复制到临时目录
          #    脚本列表仅写文件名（相对于 SCRIPT_DIR），通过 $SCRIPT_DIR 拼接源路径。
          scripts=(
            "fetch_preview_cwjd_BaiduOCR.py"
            "fetch_preview_cwjd_EasyOCR.py"
            "fetch_preview_cwjd_TesseractOCR.py"
          )
          for script in "${scripts[@]}"; do
            src="$SCRIPT_DIR/$script"   # 拼接完整源路径
            if [ -f "$src" ]; then
              cp "$src" "$WORKDIR/"
            else
              echo "⚠️ 脚本不存在: $src"
            fi
          done

          # 4. 进入临时目录执行
          cd "$WORKDIR"

          # 记录失败脚本
          failed_names=()

          # 重试函数
          retry() {
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if eval "$@"; then
                return 0
              fi
              echo "⚠️ 第 $attempt 次尝试失败，2 秒后重试..."
              sleep 2
              attempt=$((attempt + 1))
            done
            return 1
          }

          # 执行每个脚本（只执行当前目录下的脚本）
          # 使用 shopt -s nullglob 让不匹配的 glob 自动消失
          shopt -s nullglob
          for script in *.py *.php; do
            [ -f "$script" ] || continue
            script_name=$(basename "$script")
            echo "::group::执行 $script_name"
            echo "=== 开始执行: $script_name ==="

            ext="${script##*.}"
            if [ "$ext" = "py" ]; then
              cmd="python $script"
            elif [ "$ext" = "php" ]; then
              cmd="php -f $script"
            else
              echo "❌ 不支持的脚本类型: $ext"
              failed_names+=("$script_name")
              echo "::endgroup::"
              continue
            fi

            script_start=$(date +%s)
            if retry "$cmd"; then
              script_end=$(date +%s)
              duration=$((script_end - script_start))
              echo "✅ 脚本执行成功 (耗时 $duration 秒)"
            else
              script_end=$(date +%s)
              duration=$((script_end - script_start))
              echo "❌ 脚本重试 3 次后仍然失败 (耗时 $duration 秒)"
              failed_names+=("$script_name")
            fi
            echo "::endgroup::"
          done

          # 记录失败脚本到环境变量
          if [ ${#failed_names[@]} -gt 0 ]; then
            failed_names_str=$(IFS=','; echo "${failed_names[*]}")
            echo "FAILED_SCRIPTS=$failed_names_str" >> $GITHUB_ENV
            echo "❌ 以下脚本执行失败: $failed_names_str"
          else
            echo "✅ 所有脚本执行成功"
          fi
          
          # 调试用：列出临时目录中实际生成的文件
          echo "=================================="
          echo "📂 临时目录 epg/ 中的文件："
          ls -la epg/

          # 5. 将生成的所有文件复制到 tvepg_repo/epg/
          echo "=================================="
          echo "📋 复制生成的文件到 tvepg 仓库..."

          # 先创建目标目录
          mkdir -p ../tvepg_repo/epg

          # ★ 关键修复：
          #   1) 只复制 epg/ 顶层的文件（-maxdepth 1），这样不会进入
          #      epg/cwjd_image/ 子目录，图片目录天然被排除；
          #   2) 不再使用 cp --parents，避免复制后出现 tvepg_repo/epg/epg/ 的嵌套；
          #   3) 不再用 ! -path "./epg/*" 排除，那会把整个 epg/ 都过滤掉，
          #      导致生成的 XML 一个都复制不过去，最终 git 检测不到变更。
          find epg -maxdepth 1 -type f -exec cp {} ../tvepg_repo/epg/ \;

          # 校验文件是否成功复制到 tvepg_repo/epg/
          echo "📂 tvepg_repo/epg/ 中的文件："
          ls -la ../tvepg_repo/epg/

          # 返回原目录
          cd ..

          # 清理临时目录
          rm -rf "$WORKDIR"

      # 提交并推送 tvepg 仓库的变更
      - name: 提交并推送节目单到 tvepg 仓库
        if: always()
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: |
            cd tvepg_repo
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            git pull origin main --rebase --autostash

            git add -A epg/

            if ! git diff --cached --quiet; then
              files=$(git diff --cached --name-only | xargs -n1 basename | paste -sd ',' -)
              bj_time=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M")
              commit_msg="🤖 Bot: 更新节目单 [skip ci] [${bj_time} UTC+8] | 变更文件：$files"
              if [ -n "$FAILED_SCRIPTS" ]; then
                commit_msg="$commit_msg | 失败脚本：$FAILED_SCRIPTS"
              fi
              git commit -m "$commit_msg"
              git push origin main
            else
              echo "ℹ️ 没有新变更，跳过推送。"
            fi