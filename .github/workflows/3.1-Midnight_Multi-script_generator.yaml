name: 3.1 Midnight Multi-script generator

###############################################################################
# EPG数据自动生成工作流
# 
# 功能概述:
#   - 从私有仓库获取EPG生成脚本（PHP/Python）
#   - 在临时目录中执行脚本，避免污染工作目录
#   - 将生成的EPG数据推送到当前仓库的epg目录
#
# 主要特性:
#   - 支持多语言多脚本（PHP 8.2 + Python 3.x）
#   - 安全的私有仓库访问（使用PAT_TOKEN）
#   - 自动错误处理和报告机制
#   - 脚本执行后自动清理临时目录，不保留任何残留
#   - 北京时间戳的提交信息
#   - 可配置的脚本执行列表和依赖文件列表
#
# 触发条件:
#   - 定时触发: 每日UTC时间16:05（北京时间00:05）自动运行
#   - 手动触发: 可在GitHub Actions页面手动执行
#
# 前置要求:
#   - 在仓库Secrets中设置PAT_TOKEN，具有访问私有仓库的权限
#   - 私有仓库tvepg的epg_scripts分支包含所需的EPG脚本
#
# 输出结果:
#   - 生成的XML文件将保存在当前仓库的epg目录中
#   - 详细的执行日志和错误报告
###############################################################################

on:
  workflow_dispatch:  # 手动触发 - 可在GitHub Actions页面手动运行此工作流
  # schedule:
    # 定时触发 - 每天UTC时间16点04分、（北京时间凌晨0点04分）自动运行
    # - cron: '04 16 * * *'

jobs:
  generate-epg:
    runs-on: ubuntu-latest  # 使用最新版Ubuntu系统作为运行环境
    
    steps:
    # 步骤1: 检出当前仓库（作为最终推送目标的工作目录）
    - name: Checkout current repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.PAT_TOKEN }}  # 使用个人访问令牌进行认证
        fetch-depth: 1  # 获取最新git历史记录

    # 步骤2: 设置Python环境
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'  # 指定Python 3.x版本

    # 步骤3: 设置PHP环境
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'  # 指定PHP 8.2版本
        extensions: curl, xml, mbstring  # 一键安装所需扩展
        
    # 步骤4: 安装Python依赖包
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip  # 升级pip到最新版本
        # 安装Python脚本可能需要的库
        pip install requests beautifulsoup4 lxml pytz httpx aiohttp loguru curl_cffi

    # 步骤5: 安装PHP扩展（已注释，如需可取消）
    # - name: Install PHP dependencies
      # run: |
        # sudo apt-get update
        # sudo apt-get install -y php-curl php-xml php-mbstring        

    # 步骤6: 检出tvepg仓库的epg_scripts分支（用于获取脚本和依赖）
    - name: Checkout private repository (epg_scripts branch)
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/tvepg  # 私有仓库
        token: ${{ secrets.PAT_TOKEN }}  # 使用个人访问令牌
        ref: epg_scripts  # 指定分支
        path: private_repo_temp  # 检出到指定目录

    # 步骤6.5: 复制依赖文件到临时目录（仅复制存在的，不创建默认文件）
    - name: Copy dependency files
      id: copy-deps
      run: |
        # 定义依赖文件数组
        dependency_scripts=(
          # Python依赖脚本
          "bbcable_backup_channels_dict.py"
          "tvmao_channels_list.py"
          # 可以添加更多依赖文件
          # "config.json"
        )
        
        echo "🎱 依赖文件数量: ${#dependency_scripts[@]}"
        
        # 创建临时目录
        WORKDIR="workdir_$(date +%s)"
        mkdir -p "$WORKDIR"
        echo "📁 创建临时工作目录: $WORKDIR"
        
        # 循环复制每个依赖文件到临时目录
        for dep_script in "${dependency_scripts[@]}"; do
          echo "📋 复制依赖文件: $dep_script"
          if [ -f "private_repo_temp/$dep_script" ]; then
            cp "private_repo_temp/$dep_script" "$WORKDIR/"
            echo "✅ 已复制 $dep_script"
          else
            echo "⚠️ 警告: 依赖文件 $dep_script 在 tvepg/epg_scripts 分支不存在，跳过"
          fi
        done
        
        # 保存临时目录路径供后续步骤使用
        echo "WORKDIR=$WORKDIR" >> $GITHUB_ENV
        echo "dependency_count=${#dependency_scripts[@]}" >> $GITHUB_OUTPUT

    # 步骤7: 在临时目录中执行主脚本，并收集生成的数据文件
    - name: Define and execute scripts in temporary directory
      run: |
        # 定义要获取并执行的脚本数组（PHP和Python）
        scripts=(
          # "get_tvmao_epg.py"
          # "epganywhereusa.php"
          # "epg-fixer.php"          # PHP EPG修复器脚本（从EPG_CONFIG读取配置）- 当前已禁用
          # "epgguangxi.php"         # PHP 广西EPG脚本 - 当前已禁用
          # "get_mytvsuper_epg.py"      # Python mytvsuper EPG脚本 - 当前启用
          "get_asiasatv_epg.py"
          "get_kankannews_epg.py"
          "get_ofiii_epg.py"
          "get_tvbs_epg.py"
          "get_fujianhaibotv_epg.py"
        )
        
        # 定义需要保存的数据文件后缀
        SAVE_EXTENSIONS=(".xml" ".xml.gz" ".json" ".txt" ".dat")
        
        # 获取临时目录路径
        WORKDIR="${{ env.WORKDIR }}"
        echo "📁 使用临时目录: $WORKDIR"
        
        # 复制主脚本到临时目录
        echo "📋 复制主脚本到临时目录..."
        for script in "${scripts[@]}"; do
          if [ -f "private_repo_temp/$script" ]; then
            cp "private_repo_temp/$script" "$WORKDIR/"
            echo "  ✅ 已复制主脚本: $script"
          else
            echo "⚠️ 警告: 主脚本 $script 在 tvepg/epg_scripts 分支不存在，跳过"
          fi
        done
        
        # 存储失败脚本的数组
        failed_scripts=()
        
        # 进入临时目录
        cd "$WORKDIR"
        echo "📍 当前工作目录: $(pwd)"
        
        # 重试函数（每个脚本最多3次）
        retry() {
          local max_attempts=3
          local attempt=1
          while [ $attempt -le $max_attempts ]; do
            if eval "$@"; then
              return 0
            fi
            echo "⚠️ 第 $attempt 次尝试失败，2 秒后重试..."
            sleep 2
            attempt=$((attempt + 1))
          done
          return 1
        }
        
        # 循环执行每个主脚本
        for script in "${scripts[@]}"; do
          if [ ! -f "$script" ]; then
            echo "⚠️ 警告: 脚本 $script 不在临时目录，跳过"
            continue
          fi
          
          echo "::group::🛠 执行 $script"
          echo "=== 开始执行: $script ==="
          
          exit_code=0
          start_time=$(date +%s)
          
          if [[ "$script" == *.php ]]; then
            php "$script" || exit_code=$?
          elif [[ "$script" == *.py ]]; then
            python "$script" || exit_code=$?
          else
            echo "❌ 不支持的脚本类型: $script"
            exit_code=1
          fi
          
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          
          if [ $exit_code -ne 0 ]; then
            echo "❌ 脚本 $script 执行失败 (耗时 ${duration} 秒)"
            failed_scripts+=("$script")
          else
            echo "✅ 脚本 $script 执行成功 (耗时 ${duration} 秒)"
          fi
          echo "::endgroup::"
        done
        
        # ---- 收集生成的数据文件（匹配后缀）并复制到 ../epg/ ----
        echo "📂 收集生成的数据文件..."
        mkdir -p ../epg
        for ext in "${SAVE_EXTENSIONS[@]}"; do
          for file in *"$ext"; do
            if [ -f "$file" ]; then
              cp "$file" "../epg/"
              echo "  ✅ 已复制数据文件: $file -> ../epg/"
            fi
          done
        done
        
        # 返回上级目录
        cd ..
        
        # ---- 清理临时目录 ----
        rm -rf "$WORKDIR"
        echo "🧹 临时目录已清理: $WORKDIR"
        
        # 清理私有仓库临时目录
        rm -rf private_repo_temp
        
        # ---- 设置环境变量 ----
        if [ "$(ls -A epg 2>/dev/null)" ]; then
          echo "HAS_EPG_FILES=true" >> $GITHUB_ENV
        else
          echo "HAS_EPG_FILES=false" >> $GITHUB_ENV
        fi
        
        # ---- 报告执行结果 ----
        echo "=== 脚本执行结果 ==="
        if [ ${#failed_scripts[@]} -eq 0 ]; then
          echo "✅ 所有脚本执行成功!"
        else
          echo "ℹ️ 以下脚本执行失败:"
          for failed in "${failed_scripts[@]}"; do
            echo "  - $failed"
          done
          # 仅报告，不退出（允许后续步骤继续）
        fi

    # 步骤8: 配置Git用户信息
    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"  # 设置提交者名称
        git config user.email "actions@github.com"  # 设置提交者邮箱

    # 步骤9: 拉取当前仓库最新更改（防止推送冲突）
    - name: Pull latest changes from current repository
      run: |
        echo "🔄 拉取当前仓库最新更改..."
        git pull origin ${{ github.ref_name }} --rebase --autostash || {
          echo "⚠️ 拉取失败，可能没有新的更改，继续执行..."
        }
        echo "✅ 已同步到当前仓库最新状态"

    # 步骤10: 获取北京时间并提交更改到当前仓库
    - name: Get Beijing time and commit changes to current repository
      run: |
        BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')
        
        if [ -d "epg" ] && [ "$(ls -A epg 2>/dev/null)" ]; then
          git add epg/
          
          if git diff --staged --quiet; then
            echo "ℹ️ 本地当前仓库的 epg 目录没有新变更需要提交"
          else
            FILE_LIST=$(git diff --staged --name-only | sed 's#^epg/##' | tr '\n' ', ' | sed 's/,$//')
            
            if [ -n "$FILE_LIST" ]; then
              COMMIT_MSG="🔄 Download EPG数据 [北京时间: $BEIJING_TIME] | 变更: $FILE_LIST"
            else
              COMMIT_MSG="🔄 Download EPG数据 [北京时间: $BEIJING_TIME]"
            fi
            
            git commit -m "$COMMIT_MSG"
            
            # 推送（含重试）
            MAX_RETRIES=3
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "ℹ️ 尝试推送更改到当前仓库 (尝试 $((RETRY_COUNT+1))/$MAX_RETRIES)..."
              if git push origin ${{ github.ref_name }}; then
                echo "✅ 当前仓库推送成功"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT+1))
                if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                  echo "❌ 推送失败，已达到最大重试次数"
                  exit 1
                fi
                echo "🔄 推送失败，重新拉取当前仓库最新更改并重试..."
                git pull origin ${{ github.ref_name }} --rebase --autostash
              fi
            done
            
            echo "📋 提交的文件列表:"
            git show --name-only --pretty="" HEAD
          fi
        else
          echo "ℹ️ 本地当前仓库的 epg 目录为空或不存在，没有文件需要提交"
        fi