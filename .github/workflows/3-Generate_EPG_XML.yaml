name: 3 Generate EPG XML

###############################################################################
# EPG数据自动生成工作流
# 
# 功能概述:
#   - 从私有仓库获取EPG生成脚本（PHP/Python）
#   - 在临时目录中执行脚本，避免污染工作目录
#   - 将生成的EPG数据推送到当前仓库的epg目录
#
# 主要特性:
#   - 支持多语言多脚本（PHP 8.2 + Python 3.x）
#   - 安全的私有仓库访问（使用PAT_TOKEN）
#   - 自动错误处理和报告机制
#   - 脚本执行后自动清理临时目录，不保留任何残留
#   - 北京时间戳的提交信息
#   - 可配置的脚本执行列表和依赖文件列表
#   - 支持任意子目录结构（保留路径复制）
#   - 自动为Python子目录创建__init__.py
#   - 递归收集生成的数据文件，并排除已知的依赖文件、主脚本和辅助文件（如__init__.py）
#   - 提交信息中明确列出失败脚本（用 | 分隔）
#   - 新增调试输出，用于排查文件变更问题
#
# 触发条件:
#   - 手动触发: 可在GitHub Actions页面手动执行
#   - 定时触发可取消注释
###############################################################################

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '40 11 * * *'

jobs:
  generate-epg:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout current repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: curl, xml, mbstring

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml pytz httpx loguru aiohttp curl_cffi

    - name: Checkout private repository (epg_scripts branch)
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/tvepg
        token: ${{ secrets.PAT_TOKEN }}
        ref: epg_scripts
        path: private_repo_temp

    - name: Prepare temporary directory and copy scripts
      id: prepare
      run: |
        dependency_scripts=(
          "config/tvmao_channels_list.py"
          "config/bbcable_backup_channels_dict.py"
        )
        scripts=(
          "get_tvbanywhereusa_epg.php"
          "get_mytvsuper_epg.py"
          "get_huangguatv_epg.py"
          "get_rthk_epg.py"
          "get_tdm_epg.py"
          "get_macaucable_epg.py"
          "get_hkstv_epg.py"
          "get_myvideo_epg.py"
          "get_gdtv_epg.py"
          "get_fujianhaibotv_epg.py"
          "get_cctv_epg.py"
          "get_gxntv_epg.py"
        )
        
        WORKDIR="workdir_$(date +%s)"
        mkdir -p "$WORKDIR"
        echo "📁 创建临时工作目录: $WORKDIR"
        
        scripts_str=$(IFS=','; echo "${scripts[*]}")
        echo "SCRIPTS=$scripts_str" >> $GITHUB_ENV
        deps_str=$(IFS=','; echo "${dependency_scripts[*]}")
        echo "DEPS=$deps_str" >> $GITHUB_ENV
        
        echo "📋 复制依赖文件到临时目录..."
        for dep in "${dependency_scripts[@]}"; do
          src="private_repo_temp/$dep"
          if [ -f "$src" ]; then
            mkdir -p "$WORKDIR/$(dirname "$dep")"
            cp "$src" "$WORKDIR/$dep"
            echo "  ✅ 已复制依赖文件: $dep -> $WORKDIR/$dep"
          else
            echo "  ⚠️ 依赖文件 $dep 不存在，跳过"
          fi
        done
        
        echo "📋 复制主脚本到临时目录..."
        for script in "${scripts[@]}"; do
          src="private_repo_temp/$script"
          if [ -f "$src" ]; then
            mkdir -p "$WORKDIR/$(dirname "$script")" 2>/dev/null || true
            cp "$src" "$WORKDIR/$script"
            echo "  ✅ 已复制主脚本: $script -> $WORKDIR/$script"
          else
            echo "  ⚠️ 主脚本 $script 不存在，跳过"
          fi
        done
        
        # 创建 __init__.py
        find "$WORKDIR" -type f -name "*.py" -exec dirname {} \; | sort -u | while read d; do
          if [ ! -f "$d/__init__.py" ]; then
            touch "$d/__init__.py"
            echo "  ✅ 创建包标识: $d/__init__.py"
          fi
        done
        
        echo "WORKDIR=$WORKDIR" >> $GITHUB_ENV
        echo "📍 临时目录已准备就绪: $WORKDIR"

    - name: Execute main scripts in temporary directory
      run: |
        WORKDIR="${{ env.WORKDIR }}"
        cd "$WORKDIR"
        echo "📍 当前工作目录: $(pwd)"
        
        IFS=',' read -r -a scripts <<< "${{ env.SCRIPTS }}"
        failed_scripts=()
        
        retry() {
          local max_attempts=3
          local attempt=1
          while [ $attempt -le $max_attempts ]; do
            if eval "$@"; then
              return 0
            fi
            echo "⚠️ 第 $attempt 次尝试失败，2 秒后重试..."
            sleep 2
            attempt=$((attempt + 1))
          done
          return 1
        }
        
        for script in "${scripts[@]}"; do
          if [ ! -f "$script" ]; then
            echo "⚠️ 警告: 脚本 $script 不在临时目录，跳过"
            continue
          fi
          
          echo "::group::🛠 执行 $script"
          echo "=== 开始执行: $script ==="
          
          exit_code=0
          start_time=$(date +%s)
          
          if [[ "$script" == *.php ]]; then
            php "$script" || exit_code=$?
          elif [[ "$script" == *.py ]]; then
            python "$script" || exit_code=$?
          else
            echo "❌ 不支持的脚本类型: $script"
            exit_code=1
          fi
          
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          
          if [ $exit_code -ne 0 ]; then
            echo "❌ 脚本 $script 执行失败 (耗时 ${duration} 秒)"
            failed_scripts+=("$script")
          else
            echo "✅ 脚本 $script 执行成功 (耗时 ${duration} 秒)"
          fi
          echo "::endgroup::"
        done
        
        if [ ${#failed_scripts[@]} -gt 0 ]; then
          failed_names_str=$(IFS=','; echo "${failed_scripts[*]}")
          echo "FAILED_SCRIPTS=$failed_names_str" >> $GITHUB_ENV
          echo "❌ 以下脚本执行失败: $failed_names_str"
        else
          echo "✅ 所有脚本执行成功"
        fi
        
        cd ..

    - name: Collect generated data files and clean up temporary directory
      run: |
        WORKDIR="${{ env.WORKDIR }}"
        echo "📁 使用临时目录: $WORKDIR"
        
        cd "$WORKDIR"
        IFS=',' read -r -a deps <<< "${{ env.DEPS }}"
        IFS=',' read -r -a scripts <<< "${{ env.SCRIPTS }}"
        echo "🗑️ 删除已知的依赖文件、主脚本和 __init__.py..."
        for f in "${deps[@]}" "${scripts[@]}"; do
          if [ -f "$f" ]; then
            rm -f "$f"
            echo "  ✅ 已删除: $f"
          fi
        done
        find . -name "__init__.py" -type f -delete
        echo "  ✅ 已删除所有 __init__.py 辅助文件"
        
        cd ..
        
        SAVE_EXTENSIONS=(".xml" ".xml.gz" ".json" ".txt" ".dat")
        echo "📂 递归收集生成的数据文件..."
        mkdir -p ../epg
        for ext in "${SAVE_EXTENSIONS[@]}"; do
          find "$WORKDIR" -type f -name "*$ext" | while read -r file; do
            cp "$file" "../epg/"
            echo "  ✅ 已复制数据文件: $(basename "$file") -> ../epg/"
          done
        done
        
        rm -rf "$WORKDIR"
        echo "🧹 临时目录已清理: $WORKDIR"
        rm -rf private_repo_temp
        
        if [ "$(ls -A epg 2>/dev/null)" ]; then
          echo "HAS_EPG_FILES=true" >> $GITHUB_ENV
        else
          echo "HAS_EPG_FILES=false" >> $GITHUB_ENV
        fi

    # ===== 新增调试步骤 =====
    - name: Debug epg directory and file changes
      run: |
        echo "📂 当前 epg 目录文件列表："
        ls -la epg/
        echo ""
        echo "📊 文件 MD5 摘要（与 HEAD 对比）："
        for f in epg/*; do
          if [ -f "$f" ]; then
            md5=$(md5sum "$f" | cut -d' ' -f1)
            echo "$f : $md5"
          fi
        done
        echo ""
        echo "📊 Git 状态："
        git status
        echo ""
        echo "📊 工作区与 HEAD 的差异（如果有）："
        git diff --stat HEAD -- epg/
        echo ""
        echo "📊 已暂存的变更（如果有）："
        git diff --staged --stat
    # =========================

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Pull latest changes from current repository
      run: |
        echo "🔄 拉取当前仓库最新更改..."
        git pull origin ${{ github.ref_name }} --rebase --autostash || {
          echo "⚠️ 拉取失败，可能没有新的更改，继续执行..."
        }
        echo "✅ 已同步到当前仓库最新状态"

    - name: Get Beijing time and commit changes to current repository
      run: |
        BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')
        
        if [ -d "epg" ] && [ "$(ls -A epg 2>/dev/null)" ]; then
          git add epg/
          
          if git diff --staged --quiet; then
            echo "ℹ️ 本地当前仓库的 epg 目录没有新变更需要提交"
          else
            FILE_LIST=$(git diff --staged --name-only | sed 's#^epg/##' | tr '\n' ', ' | sed 's/,$//')
            
            FAILED_SCRIPTS="${{ env.FAILED_SCRIPTS }}"
            if [ -n "$FAILED_SCRIPTS" ]; then
              FAILED_MSG=" | 失败脚本: $FAILED_SCRIPTS"
            else
              FAILED_MSG=""
            fi
            
            if [ -n "$FILE_LIST" ]; then
              COMMIT_MSG="🔄 Download EPG数据 [北京时间: $BEIJING_TIME] | 变更: $FILE_LIST$FAILED_MSG"
            else
              COMMIT_MSG="🔄 Download EPG数据 [北京时间: $BEIJING_TIME]$FAILED_MSG"
            fi
            
            git commit -m "$COMMIT_MSG"
            
            MAX_RETRIES=3
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "ℹ️ 尝试推送更改到当前仓库 (尝试 $((RETRY_COUNT+1))/$MAX_RETRIES)..."
              if git push origin ${{ github.ref_name }}; then
                echo "✅ 当前仓库推送成功"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT+1))
                if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                  echo "❌ 推送失败，已达到最大重试次数"
                  exit 1
                fi
                echo "🔄 推送失败，重新拉取当前仓库最新更改并重试..."
                git pull origin ${{ github.ref_name }} --rebase --autostash
              fi
            done
            
            echo "📋 提交的文件列表:"
            git show --name-only --pretty="" HEAD
          fi
        else
          echo "ℹ️ 本地当前仓库的 epg 目录为空或不存在，没有文件需要提交"
        fi