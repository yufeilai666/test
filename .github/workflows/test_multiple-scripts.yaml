name: test_multiple-scripts

###############################################################################
# EPG数据自动生成工作流
# 
# 功能概述:
#   - 从私有仓库获取EPG生成脚本（PHP/Python）
#   - 在临时目录中执行脚本，避免污染工作目录
#   - 将生成的EPG数据推送到当前仓库的epg目录
#   - 将生成的Python备份文件推送到私有仓库tvepg的epg_scripts分支
#
# 主要特性:
#   - 支持多语言多脚本（PHP 8.2 + Python 3.x）
#   - 安全的私有仓库访问（使用PAT_TOKEN）
#   - 自动错误处理和报告机制
#   - 脚本执行后自动清理临时目录，不保留任何残留
#   - 北京时间戳的提交信息
#   - 可配置的脚本执行列表和依赖文件列表
#   - 支持所有生成文件类型（.py, .xml, .xml.gz等）
#   - 支持双向同步：从私有仓库拉取脚本，并将生成文件推送回私有仓库
#   - 支持任意子目录结构（保留路径复制）
#   - 自动为Python子目录创建__init__.py
#   - 递归收集生成的数据文件，并排除已知的依赖文件、主脚本和辅助文件
#   - 提交信息中明确列出失败脚本（用 | 分隔）
#   - 自动识别同名依赖文件：生成的文件若与依赖文件同名，自动推送到依赖文件的原位置（含子目录）
#   - 自动识别新生成的脚本文件（.py/.php），并推送到私有仓库根目录
#
# 触发条件:
#   - 定时触发: 近似每隔5天的UTC时间 19:30（北京时间3:30）自动运行
#   - 手动触发: 可在GitHub Actions页面手动执行
#
# 前置要求:
#   - 在仓库Secrets中设置PAT_TOKEN，具有访问私有仓库的权限
#   - 私有仓库tvepg的epg_scripts分支包含所需的EPG脚本
#
# 输出结果:
#   - 生成的XML文件将保存在当前仓库的epg目录中
#   - 生成的Python备份文件将推送回tvepg/epg_scripts分支
#   - 详细的执行日志和错误报告
###############################################################################

on:
  workflow_dispatch:  # 手动触发 - 可在GitHub Actions页面手动运行此工作流
  # schedule:
    # 定时触发 - 近似每隔5天的UTC时间19点30分（北京时间凌晨3点30分）自动运行
    # - cron: '30 19 1,6,11,16,21,26 * *'

jobs:
  generate-epg:
    runs-on: ubuntu-latest  # 使用最新版Ubuntu系统作为运行环境
    
    steps:
    # 步骤1: 检出当前仓库（作为最终推送目标的工作目录）
    - name: Checkout current repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.PAT_TOKEN }}  # 使用个人访问令牌进行认证
        fetch-depth: 1  # 获取最新git历史记录

    # 步骤2: 设置Python环境
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'  # 指定Python 3.x版本

    # 步骤3: 设置PHP环境
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'  # 指定PHP 8.2版本
        extensions: curl, xml, mbstring  # 一键安装所需扩展
        
    # 步骤4: 安装Python依赖包
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip  # 升级pip到最新版本
        # 安装Python脚本可能需要的库
        pip install requests beautifulsoup4 lxml pytz httpx aiohttp loguru curl_cffi

    # 步骤5: 安装PHP扩展（已注释，如需可取消）
    # - name: Install PHP dependencies
      # run: |
        # sudo apt-get update
        # sudo apt-get install -y php-curl php-xml php-mbstring        

    # 步骤6: 检出tvepg仓库的epg_scripts分支（用于获取脚本和依赖）
    - name: Checkout private repository (epg_scripts branch)
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/tvepg  # 私有仓库
        token: ${{ secrets.PAT_TOKEN }}  # 使用个人访问令牌
        ref: epg_scripts  # 指定分支
        path: private_repo_temp  # 检出到指定目录

    # 步骤7: 创建临时目录，检查并复制依赖文件，复制主脚本到临时目录（支持子目录）
    - name: Prepare temporary directory and copy scripts
      id: prepare
      run: |
        echo "📁 从 tvepg/epg_scripts 分支检查依赖文件并准备临时目录..."
        
        # ===== 定义依赖文件数组（支持任意子目录和扩展名） =====
        # 可根据实际需要添加、移除或注释掉依赖文件
        # 注意：如果依赖文件位于子目录，这里的路径需要与私有仓库中的实际路径一致
        dependency_scripts=(
          # Python依赖脚本
          "config/bbcable_backup_channels_dict.py"
          # 可以添加更多依赖文件
          "config/tvmao_channels_list.py"
          # "config.json"
          # 示例：带子目录的依赖文件
          # "config/some_config.json"
        )
        
        # ===== 定义要获取并执行的主脚本数组（支持任意子目录，PHP/Python均可） =====
        # 可以轻松添加、移除或注释不需要的脚本
        scripts=(
          "get_bbcable_backup_channels_dict.py"  # 获取BB宽频多个频道的字典
          # "epganywhereusa.php"
          # "epg-fixer.php"          # PHP EPG修复器脚本（从EPG_CONFIG读取配置）
          # "epgguangxi.php"         # PHP 广西EPG脚本
          # "get_mytvsuper_epg.py"      # Python mytvsuper EPG脚本
          # "get_mod_epg.py"
          # "get_bbcable_epg.py"
          # "get_kbro_epg.py"
          # "get_celestial_epg.py"
          # "get_tvmao_epg.py"
          # "get_katyushatv_epg.py"
          # 可添加带子目录的脚本，例如：
          # "subdir/get_xxx.py"
        )
        # ===========================================================
        
        # 创建临时工作目录（使用时间戳确保唯一性）
        WORKDIR="workdir_$(date +%s)"
        mkdir -p "$WORKDIR"
        echo "📁 创建临时工作目录: $WORKDIR"
        
        # 将主脚本列表和依赖列表存入环境变量（逗号分隔），供后续步骤使用
        scripts_str=$(IFS=','; echo "${scripts[*]}")
        echo "SCRIPTS=$scripts_str" >> $GITHUB_ENV
        deps_str=$(IFS=','; echo "${dependency_scripts[*]}")
        echo "DEPS=$deps_str" >> $GITHUB_ENV
        
        # ---- 复制依赖文件（保留完整路径） ----
        # 说明：无论依赖文件在私有仓库的哪个子目录，都会在临时工作目录中重建相同的目录结构
        echo "📋 复制依赖文件到临时目录..."
        copied_deps=""
        for dep in "${dependency_scripts[@]}"; do
          src="private_repo_temp/$dep"
          if [ -f "$src" ]; then
            mkdir -p "$WORKDIR/$(dirname "$dep")"
            cp "$src" "$WORKDIR/$dep"
            echo "  ✅ 已复制依赖文件: $dep -> $WORKDIR/$dep"
            copied_deps="$copied_deps $dep"
          else
            echo "  ⚠️ 依赖文件 $dep 在 tvepg/epg_scripts 分支不存在，跳过"
          fi
        done
        # 保存已复制的依赖文件列表（用于后续检测修改）
        echo "COPIED_DEPS=$copied_deps" >> $GITHUB_ENV
        
        # ---- 复制主脚本（保留完整路径） ----
        # 说明：与依赖文件同理，主脚本也可以位于任意子目录
        echo "📋 复制主脚本到临时目录..."
        for script in "${scripts[@]}"; do
          src="private_repo_temp/$script"
          if [ -f "$src" ]; then
            mkdir -p "$WORKDIR/$(dirname "$script")" 2>/dev/null || true
            cp "$src" "$WORKDIR/$script"
            echo "  ✅ 已复制主脚本: $script -> $WORKDIR/$script"
          else
            echo "  ⚠️ 主脚本 $script 在 tvepg/epg_scripts 分支不存在，跳过"
          fi
        done
        
        # ---- 自动为所有包含 .py 文件的子目录创建 __init__.py ----
        # 说明：如果 Python 脚本需要从子目录导入模块（如 from config.xxx import ...），
        #       则必须保证该目录是一个 Python 包，即需要有 __init__.py 文件。
        #       此步骤自动查找所有 .py 文件所在的目录，若缺少 __init__.py 则创建空文件。
        find "$WORKDIR" -type f -name "*.py" -exec dirname {} \; | sort -u | while read d; do
          if [ ! -f "$d/__init__.py" ]; then
            touch "$d/__init__.py"
            echo "  ✅ 创建包标识: $d/__init__.py"
          fi
        done
        
        # 保存临时目录路径供后续步骤使用
        echo "WORKDIR=$WORKDIR" >> $GITHUB_ENV
        echo "📍 临时目录已准备就绪: $WORKDIR"

    # 步骤8: 进入临时目录执行所有主脚本（含重试、计时、错误收集）
    - name: Execute main scripts in temporary directory
      run: |
        WORKDIR="${{ env.WORKDIR }}"
        cd "$WORKDIR"
        echo "📍 当前工作目录: $(pwd)"
        
        # 从环境变量读取主脚本列表（可能包含子目录路径）
        IFS=',' read -r -a scripts <<< "${{ env.SCRIPTS }}"
        
        # 存储失败脚本的数组
        failed_scripts=()
        
        # 重试函数（每个脚本最多3次）
        retry() {
          local max_attempts=3
          local attempt=1
          while [ $attempt -le $max_attempts ]; do
            if eval "$@"; then
              return 0
            fi
            echo "⚠️ 第 $attempt 次尝试失败，2 秒后重试..."
            sleep 2
            attempt=$((attempt + 1))
          done
          return 1
        }
        
        # 循环执行每个主脚本
        for script in "${scripts[@]}"; do
          if [ ! -f "$script" ]; then
            echo "⚠️ 警告: 脚本 $script 不在临时目录，跳过"
            continue
          fi
          
          echo "::group::🛠 执行 $script"
          echo "=== 开始执行: $script ==="
          
          exit_code=0
          start_time=$(date +%s)
          
          # 根据扩展名选择解释器（支持带路径的脚本）
          if [[ "$script" == *.php ]]; then
            php "$script" || exit_code=$?
          elif [[ "$script" == *.py ]]; then
            python "$script" || exit_code=$?
          else
            echo "❌ 不支持的脚本类型: $script"
            exit_code=1
          fi
          
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          
          if [ $exit_code -ne 0 ]; then
            echo "❌ 脚本 $script 执行失败 (耗时 ${duration} 秒)"
            failed_scripts+=("$script")
          else
            echo "✅ 脚本 $script 执行成功 (耗时 ${duration} 秒)"
          fi
          echo "::endgroup::"
        done
        
        # 记录失败脚本到环境变量（供后续提交信息使用）
        if [ ${#failed_scripts[@]} -gt 0 ]; then
          failed_names_str=$(IFS=','; echo "${failed_scripts[*]}")
          echo "FAILED_SCRIPTS=$failed_names_str" >> $GITHUB_ENV
          echo "❌ 以下脚本执行失败: $failed_names_str"
        else
          echo "✅ 所有脚本执行成功"
        fi
        
        # 返回上级目录（临时目录保留给下一步收集文件）
        cd ..

    # 步骤9: 先检测依赖文件是否被修改，再删除依赖和主脚本，然后收集生成的文件并清理临时目录
    - name: Collect generated files and clean up temporary directory
      run: |
        WORKDIR="${{ env.WORKDIR }}"
        echo "📁 使用临时目录: $WORKDIR"
        
        cd "$WORKDIR"
        
        # ---- 1. 先检测依赖文件是否被修改（此时依赖文件还在） ----
        # 注意：必须在此处检测，因为稍后我们将删除依赖文件，无法再比较。
        if [ -n "${{ env.COPIED_DEPS }}" ]; then
          COPIED_DEPS="${{ env.COPIED_DEPS }}"
          IFS=' ' read -r -a dep_array <<< "$COPIED_DEPS"
          echo "📂 检测依赖文件是否被修改..."
          for dep in "${dep_array[@]}"; do
            dep=$(echo "$dep" | xargs)
            if [ -n "$dep" ] && [ -f "$dep" ]; then
              # 原始文件位于 ../private_repo_temp/ 下，保留路径
              original_file="../private_repo_temp/$dep"
              target_dir="../private_repo_temp/$(dirname "$dep")"
              mkdir -p "$target_dir"
              target_file="$target_dir/$(basename "$dep")"
              if [ -f "$original_file" ]; then
                if ! cmp -s "$dep" "$original_file"; then
                  echo "  📁 依赖文件被修改: $dep"
                  cp "$dep" "$target_file"
                else
                  echo "  ℹ️ 依赖文件未修改: $dep"
                fi
              else
                # 原始文件不存在（可能是首次添加），直接复制
                echo "  📁 新依赖文件: $dep（原始版本不存在）"
                cp "$dep" "$target_file"
              fi
            fi
          done
        fi
        
        # ---- 2. 删除已知的依赖文件、主脚本和 __init__.py（避免误收集） ----
        IFS=',' read -r -a deps <<< "${{ env.DEPS }}"
        IFS=',' read -r -a scripts <<< "${{ env.SCRIPTS }}"
        echo "🗑️ 删除已知的依赖文件、主脚本和 __init__.py..."
        for f in "${deps[@]}" "${scripts[@]}"; do
          if [ -f "$f" ]; then
            rm -f "$f"
            echo "  ✅ 已删除: $f"
          fi
        done
        find . -name "__init__.py" -type f -delete
        echo "  ✅ 已删除所有 __init__.py 辅助文件"
        
        # ---- 3. 递归收集数据文件（匹配后缀）并复制到 ../epg/ ----
        SAVE_EXTENSIONS=(".xml" ".xml.gz" ".json" ".txt" ".dat")
        echo "📂 递归收集生成的数据文件..."
        mkdir -p ../epg
        for ext in "${SAVE_EXTENSIONS[@]}"; do
          find . -type f -name "*$ext" | while read -r file; do
            src_file="${file#./}"
            cp "$src_file" "../epg/"
            echo "  ✅ 已复制数据文件: $src_file -> ../epg/"
          done
        done
        
        # ---- 4. 递归收集所有剩余文件，根据文件类型和依赖路径决定目标位置 ----
        # 说明：
        #   1. 如果文件与某个依赖文件同名，则视为被修改的依赖文件，
        #      应放到该依赖文件原来的位置（包括子目录）。
        #   2. 否则，如果是 .py 或 .php 文件，视为新生成的脚本文件，
        #      推送到私有仓库的根目录。
        #   3. 其他类型的文件（非依赖、非 .py/.php）跳过，不收集。
        echo "📂 收集所有剩余文件..."
        
        # 构建依赖文件映射：文件名 -> 完整路径（含子目录）
        declare -A dep_full_path_map
        IFS=',' read -r -a deps_array <<< "${{ env.DEPS }}"
        for dep in "${deps_array[@]}"; do
          dep_name=$(basename "$dep")
          dep_full_path="$dep"  # 完整路径，如 "config/bbcable_backup_channels_dict.py"
          dep_full_path_map["$dep_name"]="$dep_full_path"
        done
        
        find . -type f | while read -r file; do
          src_file="${file#./}"
          file_name=$(basename "$src_file")
          file_ext="${src_file##*.}"
          
          # 检查是否有匹配的依赖文件
          if [[ -n "${dep_full_path_map[$file_name]}" ]]; then
            # 情况1：是依赖文件，使用依赖文件的完整路径（包括子目录）
            target_path="${dep_full_path_map[$file_name]}"
            echo "  📍 文件 $file_name 是依赖文件，目标路径: $target_path"
          elif [[ "$file_ext" == "py" ]] || [[ "$file_ext" == "php" ]]; then
            # 情况2：是新生成的脚本文件（不在依赖列表中），推送到根目录
            target_path="$file_name"
            echo "  📍 文件 $file_name 是新生成的脚本文件，目标路径: 根目录"
          else
            # 情况3：其他类型文件，跳过
            echo "  ℹ️ 文件 $file_name 不是依赖文件也不是脚本文件，跳过"
            continue
          fi
          
          # 确保目标目录存在
          target_dir="../private_repo_temp/$(dirname "$target_path")"
          mkdir -p "$target_dir"
          cp "$src_file" "../private_repo_temp/$target_path"
          echo "  ✅ 已复制: $src_file -> ../private_repo_temp/$target_path"
        done
        
        # 返回上级目录
        cd ..
        
        # ---- 清理临时目录 ----
        rm -rf "$WORKDIR"
        echo "🧹 临时目录已清理: $WORKDIR"
        
        # ---- 设置环境变量，指示是否有文件需要推送到各自仓库 ----
        if [ "$(ls -A epg 2>/dev/null)" ]; then
          echo "HAS_CURRENT_REPO_FILES=true" >> $GITHUB_ENV
        else
          echo "HAS_CURRENT_REPO_FILES=false" >> $GITHUB_ENV
        fi
        
        if [ "$(ls -A private_repo_temp 2>/dev/null)" ]; then
          echo "HAS_PRIVATE_REPO_FILES=true" >> $GITHUB_ENV
          echo "📁 需要推送到 tvepg/epg_scripts 分支的文件已准备就绪"
        else
          echo "HAS_PRIVATE_REPO_FILES=false" >> $GITHUB_ENV
          echo "ℹ️ 没有需要推送到 tvepg/epg_scripts 分支的文件"
        fi

    # 步骤10: 推送生成的脚本文件及被修改的依赖文件到远程 tvepg/epg_scripts 分支
    - name: Push generated scripts and modified dependencies to remote tvepg/epg_scripts branch
      if: env.HAS_PRIVATE_REPO_FILES == 'true'
      run: |
        echo "🚀 准备推送生成的脚本文件及被修改的依赖文件到远程 tvepg/epg_scripts 分支..."
        
        cd private_repo_temp
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository_owner }}/tvepg.git
        git pull origin epg_scripts --rebase --autostash
        
        BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
        git add .
        if git diff --staged --quiet; then
          echo "ℹ️ 远程 tvepg/epg_scripts 分支没有需要提交的更改"
        else
          FILE_LIST=$(git diff --staged --name-only | tr '\n' ', ' | sed 's/,$//')
          if [ -n "$FILE_LIST" ]; then
            COMMIT_MSG="🤖 自动更新生成的脚本文件及被修改的依赖文件 [北京时间: $BEIJING_TIME] | 变更: $FILE_LIST"
          else
            COMMIT_MSG="🤖 自动更新生成的脚本文件及被修改的依赖文件 [北京时间: $BEIJING_TIME]"
          fi
          git commit -m "$COMMIT_MSG"
          
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "ℹ️ 尝试推送更改到远程 tvepg/epg_scripts 分支 (尝试 $((RETRY_COUNT+1))/$MAX_RETRIES)..."
            if git push origin epg_scripts; then
              echo "✅ 成功推送生成的脚本文件及被修改的依赖文件到远程 tvepg/epg_scripts 分支"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT+1))
              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "❌ 推送失败，已达到最大重试次数"
                exit 1
              fi
              echo "🔄 推送失败，重新拉取远程 tvepg/epg_scripts 分支最新更改并重试..."
              git pull origin epg_scripts --rebase --autostash
            fi
          done
          echo "📋 推送的文件列表:"
          git show --name-only --pretty="" HEAD
        fi
        cd ..

    # 步骤11: 清理私有仓库临时目录
    - name: Clean up temporary directories
      run: |
        rm -rf private_repo_temp
        echo "✅ 临时目录已清理"

    # 步骤12: 配置Git用户信息（用于当前仓库提交）
    - name: Configure Git for current repository
      run: |
        git config user.name "GitHub Actions"  # 设置提交者名称
        git config user.email "actions@github.com"  # 设置提交者邮箱

    # 步骤13: 设置当前仓库的远程URL并拉取最新更改（避免提交冲突）
    - name: Set remote URL and pull latest changes for current repository
      run: |
        echo "🔄 设置远程URL并拉取当前仓库最新更改..."
        git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
        git pull origin ${{ github.ref_name }} --rebase --autostash || {
          echo "⚠️ 拉取失败，可能没有新的更改，继续执行..."
        }
        echo "✅ 已同步到当前仓库最新状态"

    # 步骤14: 获取北京时间并提交更改到当前仓库（仅提交本地有变更的文件）
    - name: Get Beijing time and commit changes to current repository
      run: |
        BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')
        
        if [ -d "epg" ] && [ "$(ls -A epg 2>/dev/null)" ]; then
          git add epg/
          if git diff --staged --quiet; then
            echo "ℹ️ 本地当前仓库的 epg 目录没有新变更需要提交"
          else
            FILE_LIST=$(git diff --staged --name-only | sed 's#^epg/##' | tr '\n' ', ' | sed 's/,$//')
            
            # 获取失败脚本列表（如果有），并用 " | " 分隔
            FAILED_SCRIPTS="${{ env.FAILED_SCRIPTS }}"
            if [ -n "$FAILED_SCRIPTS" ]; then
              FAILED_MSG=" | 失败脚本: $FAILED_SCRIPTS"
            else
              FAILED_MSG=""
            fi
            
            if [ -n "$FILE_LIST" ]; then
              COMMIT_MSG="🔄 Download EPG数据 [北京时间: $BEIJING_TIME] | 变更: $FILE_LIST$FAILED_MSG"
            else
              COMMIT_MSG="🔄 Download EPG数据 [北京时间: $BEIJING_TIME]$FAILED_MSG"
            fi
            
            git commit -m "$COMMIT_MSG"
            
            MAX_RETRIES=3
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "ℹ️ 尝试推送更改到当前仓库 (尝试 $((RETRY_COUNT+1))/$MAX_RETRIES)..."
              if git push origin ${{ github.ref_name }}; then
                echo "✅ 当前仓库推送成功"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT+1))
                if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                  echo "❌ 推送失败，已达到最大重试次数"
                  exit 1
                fi
                echo "🔄 推送失败，重新拉取当前仓库最新更改并重试..."
                git pull origin ${{ github.ref_name }} --rebase --autostash
              fi
            done
            echo "📋 提交的文件列表:"
            git show --name-only --pretty="" HEAD
          fi
        else
          echo "ℹ️ 本地当前仓库的 epg 目录为空或不存在，没有文件需要提交"
        fi